<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">

      <button class="nav-btn secondary" id="prevBtn">← <span id="previousLabel">Previous</span></button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
